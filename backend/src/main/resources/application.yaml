server:
  port: 8080

spring:
  application:
    name: cqa-frdm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cqa}
    username: ${DB_USER:cqa}
    password: ${DB_PASSWORD:cqa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    time-zone: UTC
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

app:
  dataset:
    url: ${ORGANIZER_DATASET_URL:}