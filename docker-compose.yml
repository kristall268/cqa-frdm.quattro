# PostgreSQL only:      docker compose up -d db
# All program (БД + backend):  docker compose --profile app up --build
name: cqa-frdm

services:
  db:
    image: postgres:16
    container_name: cqa-db
    environment:
      POSTGRES_DB: cqa
      POSTGRES_USER: ${DB_USER:-cqa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cqa}
    ports:
      - "5432:5432"
    volumes:
      - cqa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build:
      context: ./backend
    container_name: cqa-backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # внутри сети compose база доступна по имени сервиса, а не localhost
      DB_URL: jdbc:postgresql://db:5432/cqa
      DB_USER: ${DB_USER:-cqa}
      DB_PASSWORD: ${DB_PASSWORD:-cqa}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  cqa-pgdata: